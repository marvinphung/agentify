services:
  postgres:
    image: postgres:16-alpine
    container_name: agentify-postgres-compose
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentify}
      POSTGRES_DB: ${POSTGRES_DB:-agentify}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - agentify_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentify} -d ${POSTGRES_DB:-agentify}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentify-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentify}:${POSTGRES_PASSWORD:-agentify}@postgres:5432/${POSTGRES_DB:-agentify}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  agentify_postgres_data:

