name: agentify

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentify-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://agentify:agentify@131.153.239.187:5441/agentify}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "${API_PORT:-8763}:8000"
