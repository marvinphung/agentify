[project]
name = "agentify-backend"
version = "0.1.0"
description = "Agentify MVP backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "cryptography>=42.0.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.1.0",
  "pydantic-settings>=2.2.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

